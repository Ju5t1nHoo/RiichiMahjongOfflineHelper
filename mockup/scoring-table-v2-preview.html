<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计分风盘 · 调整后布局预览</title>
<style>
  :root {
    --bg: #f5f0e6; --felt: #2f6b4f; --accent: #c0392b; --gold: #d4a017;
    --ink: #2c2c2c; --muted: #7a746a; --card: #fffdf7; --line: #e7dfd0; --riichi: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #232323; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 14px; gap: 14px; color: var(--ink); }
  .stage { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  .phone { width: 390px; height: 844px; background: var(--felt); border-radius: 38px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55); display: flex; flex-direction: column; overflow: hidden;
    border: 10px solid #161616; flex-shrink: 0; }

  .felt { flex: 1; min-height: 0; display: grid;
    grid-template-areas: 'top top top' 'left center right' 'bottom bottom bottom';
    grid-template-columns: 1fr minmax(150px, auto) 1fr; grid-template-rows: auto 1fr auto;
    gap: 8px; padding: 10px; background: radial-gradient(circle at 50% 45%, #3d8060 0%, var(--felt) 60%, #27563f 100%); }

  /* 座位条带 */
  .band { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .band-top { grid-area: top; } .band-left { grid-area: left; }
  .band-right { grid-area: right; } .band-bottom { grid-area: bottom; }
  .bar { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 2px;
    background: var(--card); border-radius: 12px; padding: 8px 14px; min-width: 0; border: 2px solid transparent; }
  .bar.dealer { border-color: var(--accent); }
  .bar.riichi { background: var(--riichi); border-color: var(--riichi); }
  .bar.riichi .name, .bar.riichi .points, .bar.riichi .badge.wind { color: #fff; }
  .bar.riichi .diff { color: rgba(255,255,255,.85); }
  .band-top .bar, .band-bottom .bar { width: 100%; min-height: 112px; }
  .band-left .bar, .band-right .bar { writing-mode: vertical-rl; height: 100%; width: auto; }

  .bar-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; }
  .bar-head .name-row { justify-self: start; min-width: 0; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--felt); color: #fff;
    font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .name-row { display: flex; align-items: center; gap: 5px; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.wind { color: var(--ink); font-size: 24px; font-weight: 800; line-height: 1; }
  .bar-score { flex: 1; display: flex; align-items: center; justify-content: center; }
  .points-wrap { width: 100%; }
  .points { font-size: 24px; font-weight: 800; text-align: center; }
  .diff { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
  .points-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bar-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; flex-shrink: 0; }
  .bar-actions .act { padding: 9px 0; font-size: 17px; font-weight: 700; color: #fff; background: var(--accent);
    border: none; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .band-left .bar-actions .act, .band-right .bar-actions .act { padding: 6px 0; }

  /* 中央区（本次重排重点） */
  .center-block { grid-area: center; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; background: rgba(0,0,0,.16); color: #fff; border-radius: 14px;
    min-width: 150px; padding: 14px 12px; }
  .c-top { display: flex; gap: 8px; width: 100%; justify-content: center; }
  .pub-btn { padding: 12px 0; flex: 1; font-size: 18px; font-weight: 700; border: none; border-radius: 999px; cursor: pointer; }
  .pub-btn.back { background: rgba(255,255,255,.18); color: #fff; }
  .pub-btn.end { background: var(--accent); color: #fff; }
  .pub-btn.chombo { background: var(--gold); color: #fff; }
  .c-mode { font-size: 12px; opacity: .8; font-weight: 600; letter-spacing: .5px; }
  .round { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .c-line { font-size: 14px; opacity: .92; line-height: 1.3; }
  .dice-row { display: flex; gap: 10px; margin: 8px 0; font-size: 44px; line-height: 1; cursor: pointer; }
  .draw-btn { padding: 8px 22px; font-size: 16px; font-weight: 700; color: var(--felt); background: #fff;
    border: none; border-radius: 999px; cursor: pointer; }

  /* 模式切换 */
  .controls { background: #3a3a3a; color: #eee; border-radius: 14px; padding: 16px 20px; width: 390px; flex-shrink: 0; }
  .controls h3 { font-size: 13px; color: #aaa; margin-bottom: 12px; font-weight: 600; }
  .controls .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls button { padding: 8px 16px; border-radius: 8px; border: 1px solid #555; background: #4a4a4a; color: #eee; cursor: pointer; font-size: 13px; }
  .controls button.active { background: var(--accent); border-color: var(--accent); }

  .legend { background: #3a3a3a; color: #ddd; border-radius: 14px; padding: 14px 18px; width: 390px; font-size: 12px; line-height: 1.9; }
  .legend b { color: #ffd9a0; }
  .legend .tag { display: inline-block; padding: 1px 7px; border-radius: 5px; margin-right: 4px; font-weight: 700; }
  .legend .t-new { background: #2e8b57; color: #fff; }
  .legend .t-rm { background: #a03020; color: #fff; }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="felt" id="felt">
        <!-- 座位由脚本按模式渲染 -->
      </div>
    </div>
    <div>
      <div class="controls">
        <h3>模式切换</h3>
        <div class="row">
          <button data-mode="4" class="active">四人</button>
          <button data-mode="3">三人</button>
          <button data-mode="2">二人</button>
        </div>
      </div>
      <div class="legend" style="margin-top:14px">
        <b>本次调整点：</b><br>
        <span class="tag t-rm">删</span> 顶栏（原「← 返回 | 四人·半庄战 | 终局」）整体移除。<br>
        <span class="tag t-new">移</span> 返回 / 终局 / 罚符（单个）→ 中央区<b>上部</b>三键。<br>
        <span class="tag t-new">移</span> 「四人·半庄战」→ 并进中央区。<br>
        <span class="tag t-rm">删</span> 座位条带里的「罚符」按钮（只剩 荣和 / 自摸）。<br>
        <span class="tag t-new">拆</span> 「2本场·供托3」→ 两行：<b>2 本场</b> / <b>立直棒 3</b>。<br>
        <span class="tag t-new">留</span> 流局按钮保持在<b>下部</b>；骰子与上下按钮加大间隔。
      </div>
    </div>
  </div>

<script>
  const SEATS = {
    4: [['top', 180, '东', '张三', 26300, 'dealer'], ['left', 90, '南', '李四', 24000, ''], ['bottom', 0, '西', '王五', 25200, 'riichi'], ['right', -90, '北', '赵六', 24500, '']],
    3: [['top', 180, '东', '张三', 26800, 'dealer'], ['left', 90, '南', '李四', 24000, ''], ['right', -90, '西', '王五', 24200, 'riichi']],
    2: [['top', 180, '东', '张三', 50500, 'dealer'], ['bottom', 0, '西', '李四', 49500, 'riichi']],
  };
  const MODE_LABEL = { 4: '四人', 3: '三人', 2: '二人' };
  let mode = 4;

  function barHTML(pos, angle, wind, name, pts, extra, idx) {
    const isDealer = extra === 'dealer';
    const isRiichi = extra === 'riichi';
    const lead = false; // 简化：不标领先
    const av = name[0];
    const n = SEATS[mode].length;
    const opp = n % 2 === 0 ? (idx + n / 2) % n : -1;
    const kamicha = n >= 3 ? (idx - 1 + n) % n : -1;
    const shimocha = n >= 3 ? (idx + 1) % n : -1;
    const d = (j) => { const p = SEATS[mode][j][4]; return p - pts; };
    const fmt = (v) => (v > 0 ? '+' + v : v);
    const diffUp = opp >= 0 ? `<div class="diff">${fmt(d(opp))}</div>` : '';
    const diffL = kamicha >= 0 ? `<div class="diff">${fmt(d(kamicha))}</div>` : '';
    const diffR = shimocha >= 0 ? `<div class="diff">${fmt(d(shimocha))}</div>` : '';
    return `
      <div class="band band-${pos}">
        <div class="bar ${isDealer ? 'dealer' : ''} ${isRiichi ? 'riichi' : ''}" style="transform: rotate(${angle}deg)">
          <div class="bar-head">
            <div class="name-row"><span class="avatar">${av}</span><span class="name">${name}</span></div>
            <span class="badge wind">${wind}</span>
          </div>
          <div class="bar-score">
            <div class="points-wrap">
              ${diffUp}
              <div class="points-row">${diffL}<div class="points">${pts}</div>${diffR}</div>
            </div>
          </div>
          <div class="bar-actions">
            <button class="act">荣和</button>
            <button class="act">自摸</button>
          </div>
        </div>
      </div>`;
  }

  function centerHTML() {
    return `
      <div class="center-block">
        <div class="c-top">
          <button class="pub-btn back">返回</button>
          <button class="pub-btn end">终局</button>
          <button class="pub-btn chombo">罚符</button>
        </div>
        <div class="c-mode">${MODE_LABEL[mode]} · 半庄战</div>
        <div class="round">东 2 局</div>
        <div class="c-line">2 本场</div>
        <div class="c-line">立直棒 1</div>
        <div class="dice-row">⚀ ⚁</div>
        <button class="draw-btn">流局</button>
      </div>`;
  }

  function render() {
    const felt = document.getElementById('felt');
    const seats = SEATS[mode];
    let html = '';
    seats.forEach((s, i) => { html += barHTML(s[0], s[1], s[2], s[3], s[4], s[5], i); });
    html += centerHTML();
    felt.innerHTML = html;
  }

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.onclick = () => {
      mode = Number(btn.dataset.mode);
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    };
  });

  render();
</script>
</body>
</html>
