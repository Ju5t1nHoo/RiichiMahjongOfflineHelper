services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riichi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riichi}
      POSTGRES_DB: ${POSTGRES_DB:-riichi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riichi}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-riichi}:${POSTGRES_PASSWORD:-riichi}@db:5432/${POSTGRES_DB:-riichi}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
